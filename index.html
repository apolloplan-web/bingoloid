<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>２０２６年度 文体祭</title><style>html,body{margin:0;width:100%;height:100%;background:#000;font-family:"Yu Gothic","メイリオ",sans-serif;overflow:hidden}.container{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;z-index:1}.title{font-size:4vw;font-weight:bold;line-height:1.6;background:linear-gradient(90deg,#ff5555,#ffaa33,#ffff66,#66ff66,#66ffff,#6699ff,#cc66ff,#ff5555);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rainbowMove 12s linear infinite;filter:drop-shadow(0 0 10px rgba(255,255,255,.8))}@keyframes rainbowMove{from{background-position:0% center}to{background-position:300% center}}.controls,.effects{margin-top:20px;display:flex;gap:15px}.controls button,.effects button{padding:12px 25px;font-size:22px;font-weight:bold;border:none;border-radius:12px;cursor:pointer}.plus{background:#000000;color:grey}.minus{background:#000000;color:grey}.effects button{background:#000000;color:white}.bingo-link{margin-top:40px;padding:20px 50px;font-size:1vw;font-weight:bold;color:white;text-decoration:none;border-radius:20px;background:linear-gradient(45deg,#ff0066,#ffcc00,#00ccff,#00ff66);background-size:300% 300%;animation:rainbowMove 6s linear infinite,pulse 1.5s ease-in-out infinite;box-shadow:0 0 25px rgba(255,255,255,.5)}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}</style></head><body><canvas id="confetti"></canvas><div class="container"><div id="title" class="title">🎊 ２０２６年度 文体祭 🎊<br>in ホテルモントレ グラスミア</div><div class="controls"><button class="plus" onclick="changeFont(0.5)">＋</button><button class="minus" onclick="changeFont(-0.5)">－</button></div><div class="effects"><button onclick="startConfetti()">🎉 </button><button onclick="stopConfetti()">⏹</button></div><a class="bingo-link" href="./bingoloid.html">🎯 ビンゴ大会へ</a></div><script>let fontSize=4;function changeFont(d){fontSize=Math.max(2,Math.min(12,fontSize+d));document.getElementById('title').style.fontSize=fontSize+'vw'}const canvas=document.getElementById('confetti');const ctx=canvas.getContext('2d');function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}resizeCanvas();window.addEventListener('resize',resizeCanvas);const colors=['#ff4d4d','#ffcc00','#66ff66','#66ccff','#cc66ff','#ffffff'];const confetti=[];for(let i=0;i<150;i++){confetti.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,size:5+Math.random()*10,speed:1+Math.random()*4,angle:Math.random()*360,color:colors[Math.floor(Math.random()*colors.length)]})}let running=false,animationId=null;function animateConfetti(){if(!running)return;ctx.clearRect(0,0,canvas.width,canvas.height);confetti.forEach(c=>{ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.angle*Math.PI/180);ctx.fillStyle=c.color;ctx.fillRect(-c.size/2,-c.size/2,c.size,c.size);ctx.restore();c.y+=c.speed;c.angle+=3;if(c.y>canvas.height){c.y=-20;c.x=Math.random()*canvas.width}});animationId=requestAnimationFrame(animateConfetti)}function startConfetti(){if(running)return;running=true;animateConfetti()}function stopConfetti(){running=false;if(animationId)cancelAnimationFrame(animationId);ctx.clearRect(0,0,canvas.width,canvas.height)}</script></body></html>
